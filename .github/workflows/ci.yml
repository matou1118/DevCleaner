name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 注册表备份测试需要读写 HKCU，runner 上是普通用户权限即可
      - name: 自检
        run: python test_app.py

      - name: 版本号与更新日志一致
        shell: pwsh
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $v = (python -c "import app; print(app.__version__)").Trim()
          $log = Get-Content CHANGELOG.md -Raw -Encoding utf8
          if ($log -notmatch "## \[$([regex]::Escape($v))\]") {
            Write-Error "CHANGELOG.md 缺少版本 $v 的条目"
          }
          Write-Host "CHANGELOG 已覆盖 v$v"

      # 控制台是 cp1252，编码兜底在 app.py / test_app.py 开头做了。
      # 这里再兜一层 PowerShell 侧的读取，ConvertFrom-Json 也需要 UTF-8。
      - name: 冒烟：能跑出 JSON
        shell: pwsh
        run: |
          python app.py --json -c "构建产物" --min-age 1 > smoke.json
          $j = Get-Content smoke.json -Raw -Encoding utf8 | ConvertFrom-Json
          if ($null -eq $j.version) { Write-Error "JSON 缺少 version 字段" }
          Write-Host "扫描到 $($j.items.Count) 项"

  package:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt

      - name: 打包
        run: |
          Remove-Item -Recurse -Force build,dist -ErrorAction SilentlyContinue
          python -m PyInstaller --noconfirm DevCleaner.spec
          Copy-Item settings.yaml dist\settings.yaml

      - name: 冒烟：exe 能启动并吐出 --version
        run: |
          $v = & .\dist\DevCleaner.exe --version
          if (-not $v) { Write-Error "exe 无法启动" }
          Write-Host "exe 报告版本 $v"

      - uses: actions/upload-artifact@v4
        with:
          name: DevCleaner-${{ github.sha }}
          path: dist/DevCleaner.exe
          retention-days: 30
