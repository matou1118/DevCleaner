name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Registry backup tests need read/write on HKCU, which a normal runner user has.
      - name: Self-checks
        run: python test_app.py

      - name: Version matches CHANGELOG
        shell: pwsh
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $v = (python -c "import app; print(app.__version__)").Trim()
          $log = Get-Content CHANGELOG.md -Raw -Encoding utf8
          if ($log -notmatch "## \[$([regex]::Escape($v))\]") {
            Write-Error "CHANGELOG.md has no entry for v$v"
          }
          Write-Host "CHANGELOG covers v$v"

      # Console output is forced to UTF-8 inside app.py / test_app.py. PowerShell needs
      # its own opt-in because ConvertFrom-Json reads text too.
      - name: "Smoke: JSON output"
        shell: pwsh
        run: |
          python app.py --json -c "构建产物" --min-age 1 > smoke.json
          $j = Get-Content smoke.json -Raw -Encoding utf8 | ConvertFrom-Json
          if ($null -eq $j.version) { Write-Error "JSON is missing the version field" }
          Write-Host "$($j.items.Count) items found"

  package:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt

      - name: Package
        run: |
          Remove-Item -Recurse -Force build,dist -ErrorAction SilentlyContinue
          python -m PyInstaller --noconfirm DevCleaner.spec
          Copy-Item settings.yaml dist\settings.yaml
          Write-Host "built $([math]::Round((Get-Item dist\DevCleaner.exe).Length/1MB,1)) MB"

      # console=False 的 GUI exe 没有可靠 stdout，--version 的 print 拿不到。
      # 所以这里不解析 exe 输出，只验三件事：文件存在、不是空壳、能以退出码 0
      # 启动（哪怕没输出也算过），版本号直接从 app.py 读。
      - name: "Smoke: the packaged exe"
        run: |
          python -c "import os, re, subprocess, sys
          exe = os.path.join('dist', 'DevCleaner.exe')
          if not os.path.isfile(exe):
              raise SystemExit('exe not built')
          size = os.path.getsize(exe)
          if size < 5_000_000:
              raise SystemExit('exe is only %d bytes - looks truncated' % size)
          print('exe size: %.1f MB' % (size / 1048576))
          r = subprocess.run([exe, '--version'], capture_output=True,
                             text=True, errors='replace', timeout=300)
          out = (r.stdout or '') + (r.stderr or '')
          print('rc=%d out=%r' % (r.returncode, out.strip()[:80]))
          if r.returncode != 0:
              raise SystemExit('exe exited %d' % r.returncode)
          ver = re.search(r'\d+\.\d+\.\d+', out)
          import app
          if ver and ver.group(0) != app.__version__:
              raise SystemExit('version mismatch: exe=%s source=%s'
                               % (ver.group(0), app.__version__))
          print('version OK:', app.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: DevCleaner-exe
          path: dist/DevCleaner.exe
          retention-days: 30

  # 这里原来有一个 release job：推 tag 时用 softprops/action-gh-release 把 CI 自己
  # 编的 exe 传上去。该 action 默认 overwrite_files=true，会把发布页上那份「人已经
  # 打开确认过」的二进制悄悄换成一个没人跑过的 —— 发布页和用户手里的对不上，
  # 出了 bug 谁都说不清是哪一份。
  #
  # 现在发布只有一个写者：本地 build.bat 出包 -> 用户实际打开确认 -> 上传。
  # CI 只负责证明「这份源码在 3.10~3.13 上能编能跑」，产物留作 artifact。
  #
  # 真要恢复自动发布，先加 overwrite_files: false，别让它覆盖。
