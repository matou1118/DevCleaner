name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Registry backup tests need read/write on HKCU, which a normal runner user has.
      - name: Self-checks
        run: python test_app.py

      - name: Version matches CHANGELOG
        shell: pwsh
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $v = (python -c "import app; print(app.__version__)").Trim()
          $log = Get-Content CHANGELOG.md -Raw -Encoding utf8
          if ($log -notmatch "## \[$([regex]::Escape($v))\]") {
            Write-Error "CHANGELOG.md has no entry for v$v"
          }
          Write-Host "CHANGELOG covers v$v"

      # Console output is forced to UTF-8 inside app.py / test_app.py. PowerShell needs
      # its own opt-in because ConvertFrom-Json reads text too.
      - name: "Smoke: JSON output"
        shell: pwsh
        run: |
          python app.py --json -c "构建产物" --min-age 1 > smoke.json
          $j = Get-Content smoke.json -Raw -Encoding utf8 | ConvertFrom-Json
          if ($null -eq $j.version) { Write-Error "JSON is missing the version field" }
          Write-Host "$($j.items.Count) items found"

  package:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt

      - name: Package
        run: |
          Remove-Item -Recurse -Force build,dist -ErrorAction SilentlyContinue
          python -m PyInstaller --noconfirm DevCleaner.spec
          Copy-Item settings.yaml dist\settings.yaml
          Write-Host "built $([math]::Round((Get-Item dist\DevCleaner.exe).Length/1MB,1)) MB"

      - name: "Smoke: the exe starts and reports its version"
        run: |
          $v = & .\dist\DevCleaner.exe --version
          if (-not $v) { Write-Error "the exe failed to start" }
          if ($v -notmatch "^\S+ \d+\.\d+\.\d+$") { Write-Error "unexpected --version output: $v" }
          Write-Host "exe reports: $v"

      - uses: actions/upload-artifact@v4
        with:
          name: DevCleaner-exe
          path: dist/DevCleaner.exe
          retention-days: 30

  # Pushing a tag (v1.2.3) publishes a GitHub Release with the exe attached.
  # Draft by default so you can read the notes before it goes public.
  release:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write          # required to create a Release

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DevCleaner-exe
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/DevCleaner.exe
